<!--
  CONTADOR DE VIEWERS — Overlay para OBS (arquivo único)
  ============================================================
  Mostra, de forma compacta, quantas pessoas estão assistindo em
  cada plataforma (Twitch, YouTube e Kick). Aceita vários canais
  por plataforma — é só ir somando na URL.

  TUDO num arquivo só. Twitch funciona direto, sem nada a configurar.
  YouTube usa a YouTube Data API v3 (modo "apikey" — a chave já está no
  CONFIG). O modo "scrape" sem chave existe no código, mas NÃO funciona
  com o corsproxy.io grátis: a página da live do YouTube passa de 1MB e
  o corsproxy.io corta nesse tamanho.
  Kick bate direto na API dele (funcionou sem proxy nos testes). Se um dia
  voltar a dar erro de CORS, é só preencher o campo kickProxy no CONFIG.

  ------------------------------------------------------------
  PASSO A PASSO
  ------------------------------------------------------------
   1. (Opcional) Para usar o YouTube no modo "apikey", pegue uma chave da
      YouTube Data API v3: console.cloud.google.com -> criar projeto ->
      "APIs e serviços" -> ativar "YouTube Data API v3" -> Credenciais ->
      Criar chave de API. Recomendado restringir por domínio github.io e
      por API. Se quiser rodar SEM chave, pule este passo (fica no modo
      "scrape" automaticamente).
   2. Se pegou a chave, cole-a no campo youtubeApiKey no bloco CONFIG.
   3. Hospede este arquivo no GitHub Pages (mesmo lugar do overlay de
      localização). É obrigatório: o corsproxy.io grátis só aceita
      requisições vindas de origens da lista dele (*.github.io está na
      lista). Abrir como file:// NÃO funciona.
   4. No OBS: Fontes -> + -> Navegador. Em "URL", aponte para este arquivo
      COM os canais na query (exemplos abaixo). Largura 600 · Altura 400.
   5. Se algum dia o corsproxy.io não der conta do Kick (ele fica atrás do
      Cloudflare e PODE ser bloqueado), veja o bloco "PLANO B — PROXY
      PRÓPRIO DO KICK" no fim deste arquivo.

  ------------------------------------------------------------
  PARÂMETROS DA URL
  ------------------------------------------------------------
   twitch=canal1,canal2        -> 1+ canais da Twitch (login do canal)
   youtube=@canal,UCxxxx,v:ID  -> 1+ canais do YouTube. Pode ser handle
                                  (@nome), channelId (UC...) ou o ID do
                                  vídeo da live direto (v:VIDEO_ID).
                                  Funciona nos dois modos (scrape/apikey).
                                  No modo "apikey": @nome/UC... gastam 100
                                  unidades de cota por descoberta de live
                                  (com cache); v:VIDEO_ID gasta só 1.
                                  No modo "scrape" não há cota — mas o
                                  v:VIDEO_ID é o mais confiável de parsear.
   kick=canal1,canal2          -> 1+ canais do Kick (slug do canal).
                                  Conecta direto na API do Kick.
   mode=sum | each | total     -> sum:   1 linha por plataforma (total da
                                          plataforma somado)
                                  each:  1 linha por canal
                                  total: 1 linha só — ícones de todas as
                                         plataformas lado a lado + a soma
                                         geral de TODOS os canais.
                                  Padrão: sum
   layout=vertical | horizontal-> empilhado ou lado a lado. Padrão: vertical
   pos=top-left | top-right |
       bottom-left | bottom-right -> canto do card. Padrão: top-left
   compact=1                   -> números curtos (1,2 mil em vez de 1.234)
   hideoffline=1               -> esconde quem está offline (padrão: esmaecido)
                                  no modo "total", esconde também o ícone
                                  da plataforma que não tiver ninguém ao vivo
   bg=0..100                   -> opacidade do fundo do card (0 = transparente,
                                  100 = sólido). Padrão: 78
   poll=20                     -> intervalo de atualização em segundos (padrão: 20)
   setup=1                     -> abre o WIZARD de configuração (formulário que
                                  monta a URL pronta). O wizard também aparece
                                  sozinho quando nenhum canal foi configurado.

  Exemplo completo:
   contador-viewers.html?twitch=canalA,canalB&youtube=@canalC&kick=canalD&mode=each&pos=top-right
  ============================================================
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contador de Viewers</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@600;700&family=Outfit:wght@500;600&display=swap"
  rel="stylesheet"
/>
<style>
  /* ===== TEMA — ajuste à vontade ===== */
  :root {
    --bg-rgb:        14, 15, 20;   /* cor de fundo do card (R, G, B) */
    --bg-alpha:      0.78;         /* opacidade do fundo (0 = transparente, 1 = sólido) */
    --bg:            rgba(var(--bg-rgb), var(--bg-alpha));
    --border:        rgba(255, 255, 255, 0.10);
    --text:          #f4f4f6;
    --text-dim:      #9aa0ac;
    --radius:        14px;
    --gap:           7px;          /* espaço entre linhas */
    --pad:           11px;
    --margin:        24px;         /* distância do card até a borda da tela */
    --row-h:         42px;
    --num-size:      19px;
    --shadow:        0 8px 28px rgba(0, 0, 0, 0.45);

    /* cores das plataformas */
    --twitch:        #9146ff;
    --youtube:       #ff0033;
    --kick:          #53fc18;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Outfit", sans-serif;
  }

  /* posicionamento do card nos cantos */
  #widget {
    position: fixed;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    padding: var(--pad);
    /* o fundo, a borda, a sombra e o desfoque (efeito vidro) TODOS escalam
       junto com a opacidade (--bg-alpha). Quando bg=0, o card some por
       completo — sobra só os ícones e os números flutuando. */
    background: var(--bg);
    border: 1px solid rgba(255, 255, 255, calc(0.10 * var(--bg-alpha)));
    border-radius: var(--radius);
    box-shadow: 0 8px 28px rgba(0, 0, 0, calc(0.45 * var(--bg-alpha)));
    backdrop-filter: blur(calc(14px * var(--bg-alpha))) saturate(140%);
    -webkit-backdrop-filter: blur(calc(14px * var(--bg-alpha))) saturate(140%);
    transition: opacity 0.4s ease;
  }
  #widget.layout-horizontal { flex-direction: row; }

  #widget.pos-top-left     { top: var(--margin);    left: var(--margin); }
  #widget.pos-top-right    { top: var(--margin);    right: var(--margin); }
  #widget.pos-bottom-left  { bottom: var(--margin); left: var(--margin); }
  #widget.pos-bottom-right { bottom: var(--margin); right: var(--margin); }

  #widget.stale { opacity: 0.45; }

  /* cada linha = ícone + número */
  .row {
    display: flex;
    align-items: center;
    gap: 9px;
    height: var(--row-h);
    padding-right: 4px;
    opacity: 0;
    transform: translateY(6px);
    animation: rowIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes rowIn { to { opacity: 1; transform: translateY(0); } }

  .row.offline { opacity: 0.34; }
  .row.offline .live-dot { background: var(--text-dim); box-shadow: none; }

  /* badge do ícone da plataforma */
  .badge {
    width: var(--row-h);
    height: var(--row-h);
    flex-shrink: 0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    /* sombra leve sempre presente: dá relevo aos ícones quando o card
       está transparente (bg=0) e some quase nada quando há fundo */
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
  }
  .badge svg { width: 56%; height: 56%; display: block; }
  .badge.twitch  { background: var(--twitch);  }
  .badge.youtube { background: var(--youtube); }
  .badge.kick    { background: var(--kick);    }
  .badge.twitch  svg { fill: #fff; }
  .badge.youtube svg { fill: #fff; }
  .badge.kick    svg { fill: #0c0c0c; }

  /* grupo de ícones lado a lado (modo "total") */
  .badge-group {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .badge-group .badge {
    width: calc(var(--row-h) - 8px);
    height: calc(var(--row-h) - 8px);
    border-radius: 8px;
  }

  /* bloco de texto à direita do ícone */
  .info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 1.05;
    min-width: 0;
  }
  .count-line { display: flex; align-items: baseline; gap: 6px; }
  .count {
    font-family: "Chivo Mono", monospace;
    font-weight: 700;
    font-size: var(--num-size);
    color: var(--text);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    /* sombra SEMPRE presente — garante que o número fique legível mesmo
       com o fundo do card zerado, sobre qualquer cena */
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 3px rgba(0, 0, 0, 0.7);
  }
  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ff3b3b;
    box-shadow: 0 0 6px rgba(255, 59, 59, 0.9);
    flex-shrink: 0;
    align-self: center;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.35; transform: scale(0.78); }
  }
  .label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: lowercase;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 130px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
  }

  /* mensagem de configuração / erro */
  .hint {
    font-size: 12px;
    color: var(--text-dim);
    padding: 6px 4px;
    max-width: 260px;
    line-height: 1.4;
  }
  .hint b { color: var(--text); font-weight: 600; }

  /* ===================== WIZARD ===================== */
  #wizard {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 380px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: rgba(16, 17, 23, 0.97);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
    padding: 20px;
    font-family: "Outfit", sans-serif;
    color: var(--text);
  }
  #wizard h1 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 2px;
    letter-spacing: -0.01em;
  }
  #wizard .sub {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  #wizard .group { margin-bottom: 14px; }
  #wizard .group-title {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 7px;
  }
  #wizard label {
    display: block;
    font-size: 12px;
    color: var(--text);
    margin-bottom: 3px;
  }
  #wizard .field { margin-bottom: 9px; }
  #wizard .hintline {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  #wizard input[type="text"],
  #wizard input[type="number"],
  #wizard select {
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: "Outfit", sans-serif;
    font-size: 12.5px;
    padding: 7px 9px;
    outline: none;
  }
  #wizard input:focus, #wizard select:focus {
    border-color: rgba(255, 255, 255, 0.28);
  }
  #wizard .row2 { display: flex; gap: 8px; }
  #wizard .row2 > div { flex: 1; }
  #wizard .check {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    margin-bottom: 7px;
    cursor: pointer;
  }
  #wizard .check input { width: 14px; height: 14px; accent-color: var(--twitch); cursor: pointer; }
  #wizard .slider-row { display: flex; align-items: center; gap: 9px; }
  #wizard input[type="range"] {
    flex: 1;
    accent-color: var(--twitch);
    cursor: pointer;
  }
  #wizard .slider-val {
    font-family: "Chivo Mono", monospace;
    font-size: 12px;
    color: var(--text-dim);
    min-width: 38px;
    text-align: right;
  }
  #wizard .out {
    margin-top: 6px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 9px;
    font-family: "Chivo Mono", monospace;
    font-size: 10.5px;
    color: var(--text-dim);
    word-break: break-all;
    line-height: 1.45;
    max-height: 78px;
    overflow-y: auto;
  }
  #wizard .btns { display: flex; gap: 8px; margin-top: 12px; }
  #wizard button {
    flex: 1;
    border: none;
    border-radius: 9px;
    padding: 9px 10px;
    font-family: "Outfit", sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  #wizard button:active { transform: scale(0.98); }
  #wizard button.primary { background: var(--twitch); color: #fff; }
  #wizard button.ghost {
    background: rgba(255, 255, 255, 0.07);
    color: var(--text);
    border: 1px solid var(--border);
  }
  #wizard button:hover { filter: brightness(1.12); }
  #wizard .copied {
    font-size: 11px;
    color: var(--kick);
    text-align: center;
    margin-top: 8px;
    height: 13px;
  }

  /* prévia ao vivo dentro do wizard */
  #wizard .preview-stage {
    position: relative;
    width: 100%;
    height: 170px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background:
      radial-gradient(circle at 22% 26%, rgba(120, 90, 255, 0.55), transparent 46%),
      radial-gradient(circle at 82% 78%, rgba(0, 190, 165, 0.42), transparent 52%),
      linear-gradient(135deg, #2b2742, #14131c 72%);
  }
  #wizard .preview-caption {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 5px;
    text-align: center;
  }
  #wizard .preview-card {
    position: absolute;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    padding: var(--pad);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
  }
  #wizard .preview-card.layout-horizontal { flex-direction: row; }
  #wizard .preview-card.ppos-top-left {
    top: 12px; left: 12px; transform-origin: top left; transform: scale(0.85);
  }
  #wizard .preview-card.ppos-top-right {
    top: 12px; right: 12px; transform-origin: top right; transform: scale(0.85);
  }
  #wizard .preview-card.ppos-bottom-left {
    bottom: 12px; left: 12px; transform-origin: bottom left; transform: scale(0.85);
  }
  #wizard .preview-card.ppos-bottom-right {
    bottom: 12px; right: 12px; transform-origin: bottom right; transform: scale(0.85);
  }
</style>
</head>
<body>
<div id="widget"></div>

<script>
/* ===================== CONFIG ===================== */
const CONFIG = {
  // Como ler a contagem do YouTube:
  //   "apikey"  -> usa a YouTube Data API v3 (precisa da chave em
  //               youtubeApiKey). É o jeito estável e confiável. << EM USO
  //   "scrape"  -> SEM chave: leria a página da live via youtubeProxy.
  //               NÃO funciona com o corsproxy.io grátis — a página do
  //               YouTube passa de 1MB e o corsproxy.io corta em 1MB.
  //               Só serve com um proxy sem limite de tamanho (ex.: um
  //               Worker seu). Por isso estamos no modo "apikey".
  //   "auto"    -> usa "apikey" se houver chave; senão "scrape".
  youtubeMode: "apikey",

  // Chave da YouTube Data API v3.
  // console.cloud.google.com -> ativar "YouTube Data API v3" -> Credenciais.
  // IMPORTANTE: como este arquivo fica público no GitHub Pages, restrinja
  // esta chave no Google Cloud (Referenciadores HTTP -> seu domínio
  // github.io; e API -> só YouTube Data API v3).
  youtubeApiKey: "AIzaSyDmX-Py-jLaC9WCuqUoIkt76sGm5weAjXE",

  // youtubeProxy: só é usado no modo "scrape". Como o corsproxy.io corta
  //   em 1MB e a página do YouTube é maior que isso, o scrape NÃO funciona
  //   com ele. Deixado aqui só para o caso de um dia você usar um proxy
  //   sem limite de tamanho.
  youtubeProxy: "https://corsproxy.io/?url=",
  //
  // kickProxy: VAZIO = bate direto na API do Kick (funcionou no teste).
  //   Se algum dia o Kick voltar a bloquear (erro de CORS no console),
  //   é só preencher com "https://corsproxy.io/?url=" — ou com a URL do
  //   seu proxy próprio do PLANO B (ver fim do arquivo).
  kickProxy: "",

  // valores padrão (a URL do overlay sobrescreve estes)
  pollInterval: 20,        // segundos
  mode: "sum",             // "sum" = total por plataforma | "each" = por canal | "total" = soma geral numa linha
  layout: "vertical",      // "vertical" | "horizontal"
  position: "top-left",    // top-left | top-right | bottom-left | bottom-right
  compactNumbers: false,   // true => "1,2 mil"
  hideOffline: false,      // true => some com quem está offline
  bgOpacity: 78,           // opacidade do fundo do card, 0 a 100

  // canais padrão, usados SÓ se a URL não trouxer nenhum parâmetro
  defaults: { twitch: [], youtube: [], kick: [] },

  // cache (em memória) da descoberta de live no YouTube (modo apikey)
  ytLiveCacheMs: 2 * 60 * 60 * 1000,  // 2h enquanto a live está no ar
  ytOfflineCacheMs: 5 * 60 * 1000,    // 5min antes de procurar de novo
};
/* ================================================== */

const PLATFORMS = ["twitch", "youtube", "kick"];

// logos (Twitch e YouTube em path; Kick desenhado em blocos)
const ICONS = {
  twitch:
    '<svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>',
  youtube:
    '<svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
  kick:
    '<svg viewBox="0 0 24 24">' +
    '<rect x="3" y="3" width="5" height="18"/>' +
    '<rect x="8" y="8.5" width="5" height="7"/>' +
    '<rect x="14" y="3" width="5" height="5.5"/>' +
    '<rect x="14" y="15.5" width="5" height="5.5"/>' +
    "</svg>",
};

/* ---------- ler parâmetros da URL ---------- */
const params = new URLSearchParams(location.search);

function listParam(name) {
  const raw = params.get(name);
  if (!raw) return null;
  return raw.split(",").map((s) => s.trim()).filter(Boolean);
}

const channels = {
  twitch: listParam("twitch"),
  youtube: listParam("youtube"),
  kick: listParam("kick"),
};
const hasAnyFromUrl = PLATFORMS.some((p) => channels[p]);
if (!hasAnyFromUrl) {
  PLATFORMS.forEach((p) => (channels[p] = CONFIG.defaults[p]));
} else {
  PLATFORMS.forEach((p) => (channels[p] = channels[p] || []));
}

const settings = {
  poll: Math.max(5, parseInt(params.get("poll"), 10) || CONFIG.pollInterval),
  mode: params.get("mode") || CONFIG.mode,
  layout: params.get("layout") || CONFIG.layout,
  position: params.get("pos") || CONFIG.position,
  compact: params.get("compact") === "1" || CONFIG.compactNumbers,
  hideOffline: params.get("hideoffline") === "1" || CONFIG.hideOffline,
  bg: (function () {
    const raw = params.get("bg");
    const n = raw == null ? CONFIG.bgOpacity : parseInt(raw, 10);
    return Math.max(0, Math.min(100, isNaN(n) ? CONFIG.bgOpacity : n));
  })(),
};

// aplica a opacidade do fundo (parâmetro bg=0..100)
document.documentElement.style.setProperty("--bg-alpha", settings.bg / 100);

/* ---------- formatação de número (pt-BR) ---------- */
const fmtFull = new Intl.NumberFormat("pt-BR");
const fmtCompact = new Intl.NumberFormat("pt-BR", {
  notation: "compact",
  maximumFractionDigits: 1,
});
function fmt(n) {
  return settings.compact ? fmtCompact.format(n) : fmtFull.format(n);
}

/* =================================================================
   FETCHERS — cada plataforma é independente e trata seus próprios
   erros, então uma falhar nunca derruba as outras.
   Formato de retorno: { channel, live, viewers, error }
   ================================================================= */

/* ---------- TWITCH (via DecAPI — sem chave) ---------- */
async function getTwitch(channel) {
  try {
    const r = await fetch(
      "https://decapi.me/twitch/viewercount/" + encodeURIComponent(channel),
      { cache: "no-store" }
    );
    const text = (await r.text()).trim();
    // DecAPI devolve só o número quando está ao vivo; qualquer outra
    // coisa ("<canal> is offline" etc.) significa fora do ar.
    if (/^\d+$/.test(text)) {
      return { channel, live: true, viewers: parseInt(text, 10), error: null };
    }
    return { channel, live: false, viewers: 0, error: null };
  } catch (e) {
    return { channel, live: false, viewers: null, error: "twitch_falhou" };
  }
}

/* ---------- YOUTUBE ----------
   Dois modos: "apikey" (YouTube Data API v3) e "scrape" (lê a página
   da live via youtubeProxy, sem chave). O dispatcher getYouTube() escolhe. */

function ytUseScrape() {
  if (CONFIG.youtubeMode === "scrape") return true;
  if (CONFIG.youtubeMode === "apikey") return false;
  // "auto": usa scrape se não houver chave configurada
  return !CONFIG.youtubeApiKey || CONFIG.youtubeApiKey.includes("COLE_AQUI");
}

async function getYouTube(input) {
  return ytUseScrape() ? getYouTubeScrape(input) : getYouTubeApi(input);
}

/* ===== modo SCRAPE (sem chave de API) ===== */
async function getYouTubeScrape(input) {
  try {
    // monta a URL da página da live conforme o tipo de identificador
    let pageUrl;
    if (input.startsWith("v:")) {
      pageUrl = "https://www.youtube.com/watch?v=" + encodeURIComponent(input.slice(2));
    } else if (input.startsWith("UC")) {
      pageUrl = "https://www.youtube.com/channel/" + input + "/live";
    } else {
      const handle = input.startsWith("@") ? input : "@" + input;
      pageUrl = "https://www.youtube.com/" + handle + "/live";
    }
    pageUrl += (pageUrl.indexOf("?") >= 0 ? "&" : "?") + "_cb=" + Date.now();

    // O YouTube precisa do proxy (a página não envia CORS). Se youtubeProxy
    // estiver vazio, bate direto (vai falhar com erro de CORS).
    const proxy = (CONFIG.youtubeProxy || "").trim();
    const fetchUrl = proxy ? proxy + encodeURIComponent(pageUrl) : pageUrl;

    const r = await fetch(fetchUrl, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const html = await r.text();
    const parsed = parseYtViewers(html);
    if (!parsed.found) {
      // não achou o contador -> provavelmente o canal não está ao vivo
      return { channel: input, live: false, viewers: 0, error: null };
    }
    return {
      channel: input,
      live: parsed.live,
      viewers: parsed.live ? parsed.viewers : 0,
      error: null,
    };
  } catch (e) {
    console.warn("[contador-viewers] YouTube (scrape) falhou para '" + input + "':", e);
    return { channel: input, live: false, viewers: null, error: "yt_falhou" };
  }
}

// extrai a contagem de "assistindo agora" do HTML da página do YouTube.
// O número vem dentro do ytInitialData, no videoViewCountRenderer.
function parseYtViewers(html) {
  // ex. ao vivo: "viewCount":{"runs":[{"text":"1.234"},{"text":" assistindo agora"}
  let m = html.match(
    /"videoViewCountRenderer":\{"viewCount":\{"runs":\[\{"text":"([\d.,\s]+)"\},\{"text":"([^"]*)"/
  );
  if (m) {
    const n = parseInt(m[1].replace(/\D/g, ""), 10);
    // "watching"/"assistindo" no segundo run = está AO VIVO agora
    const live = /watch|assist/i.test(m[2]);
    if (!isNaN(n)) return { found: true, live, viewers: n };
  }
  // fallback: campo originalViewCount (número cru) + flag isLiveContent
  m = html.match(/"originalViewCount":"(\d+)"/);
  if (m) {
    const n = parseInt(m[1], 10);
    const live = /"isLiveContent":true/.test(html) || /"isLive":true/.test(html);
    if (!isNaN(n)) return { found: true, live, viewers: n };
  }
  return { found: false, live: false, viewers: 0 };
}

/* ===== modo APIKEY (YouTube Data API v3) ===== */
const ytMem = { chan: new Map(), live: new Map() };

async function ytResolveChannelId(input) {
  if (input.startsWith("UC")) return input; // já é channelId
  const handle = input.startsWith("@") ? input : "@" + input;
  if (ytMem.chan.has(handle)) return ytMem.chan.get(handle);
  const r = await fetch(
    "https://www.googleapis.com/youtube/v3/channels?part=id&forHandle=" +
      encodeURIComponent(handle) +
      "&key=" +
      CONFIG.youtubeApiKey
  );
  const j = await r.json();
  const id = j.items && j.items[0] && j.items[0].id;
  if (id) ytMem.chan.set(handle, id);
  return id || null;
}

async function ytResolveLiveVideo(channelId) {
  const cached = ytMem.live.get(channelId);
  if (cached && cached.expires > Date.now()) return cached.videoId;
  // search.list — 100 unidades de cota
  const r = await fetch(
    "https://www.googleapis.com/youtube/v3/search?part=id&channelId=" +
      encodeURIComponent(channelId) +
      "&eventType=live&type=video&key=" +
      CONFIG.youtubeApiKey
  );
  const j = await r.json();
  const vid = j.items && j.items[0] && j.items[0].id && j.items[0].id.videoId;
  ytMem.live.set(channelId, {
    videoId: vid || null,
    expires: Date.now() + (vid ? CONFIG.ytLiveCacheMs : CONFIG.ytOfflineCacheMs),
  });
  return vid || null;
}

async function getYouTubeApi(input) {
  if (!CONFIG.youtubeApiKey || CONFIG.youtubeApiKey.includes("COLE_AQUI")) {
    return { channel: input, live: false, viewers: null, error: "yt_sem_chave" };
  }
  try {
    let videoId;
    if (input.startsWith("v:")) {
      videoId = input.slice(2);
    } else {
      const cid = await ytResolveChannelId(input);
      if (!cid)
        return { channel: input, live: false, viewers: 0, error: "yt_canal_nao_encontrado" };
      videoId = await ytResolveLiveVideo(cid);
    }
    if (!videoId) return { channel: input, live: false, viewers: 0, error: null };

    const r = await fetch(
      "https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=" +
        encodeURIComponent(videoId) +
        "&key=" +
        CONFIG.youtubeApiKey
    );
    const j = await r.json();
    const item = j.items && j.items[0];
    const cv =
      item && item.liveStreamingDetails && item.liveStreamingDetails.concurrentViewers;

    if (cv == null) {
      // vídeo não está mais ao vivo — invalida o cache pra procurar de novo
      if (!input.startsWith("v:")) {
        const cid = await ytResolveChannelId(input);
        if (cid) ytMem.live.delete(cid);
      }
      return { channel: input, live: false, viewers: 0, error: null };
    }
    return { channel: input, live: true, viewers: parseInt(cv, 10), error: null };
  } catch (e) {
    console.warn("[contador-viewers] YouTube (apikey) falhou para '" + input + "':", e);
    return { channel: input, live: false, viewers: null, error: "yt_falhou" };
  }
}

/* ---------- KICK (direto, ou via kickProxy se preenchido) ---------- */
async function getKick(slug) {
  try {
    let url, mode;
    const proxy = (CONFIG.kickProxy || "").trim();
    const kickApi =
      "https://kick.com/api/v2/channels/" +
      encodeURIComponent(slug) +
      "?_cb=" +
      Date.now();

    if (!proxy) {
      // Sem proxy: bate DIRETO na API do Kick (funcionou no teste).
      url = kickApi;
      mode = "wrap";
    } else if (proxy.endsWith("=")) {
      // proxy CORS genérico (ex.: corsproxy.io/?url=) — embrulha a API do Kick.
      url = proxy + encodeURIComponent(kickApi);
      mode = "wrap";
    } else {
      // proxy dedicado do Kick (o Worker do PLANO B) — usa ?slug=
      url = proxy.replace(/\/+$/, "") + "?slug=" + encodeURIComponent(slug);
      mode = "dedicated";
    }

    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();

    if (mode === "wrap") {
      // resposta crua da API v2 do Kick: campo "livestream" (null = offline)
      const ls = j.livestream;
      return {
        channel: slug,
        live: !!(ls && ls.is_live),
        viewers: ls && ls.is_live ? ls.viewer_count || 0 : 0,
        error: null,
      };
    }
    // proxy dedicado já devolve { live, viewers }
    return {
      channel: slug,
      live: !!j.live,
      viewers: j.live ? j.viewers || 0 : 0,
      error: null,
    };
  } catch (e) {
    console.warn("[contador-viewers] Kick falhou para '" + slug + "':", e);
    return { channel: slug, live: false, viewers: null, error: "kick_falhou" };
  }
}

/* =================================================================
   RENDERIZAÇÃO
   ================================================================= */
const widget = document.getElementById("widget");
widget.classList.add("layout-" + settings.layout, "pos-" + settings.position);

const rowEls = {}; // chave -> { count, rowEl, valueShown }
let built = false;

function showHint(html) {
  widget.innerHTML = '<div class="hint">' + html + "</div>";
  built = false;
}

function buildRows() {
  widget.innerHTML = "";
  Object.keys(rowEls).forEach((k) => delete rowEls[k]);

  // helper: cria o bloco .info (linha do número + ponto de "ao vivo")
  function makeInfo(labelText) {
    const info = document.createElement("div");
    info.className = "info";
    const countLine = document.createElement("div");
    countLine.className = "count-line";
    const dot = document.createElement("span");
    dot.className = "live-dot";
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = "—";
    countLine.appendChild(dot);
    countLine.appendChild(count);
    info.appendChild(countLine);
    if (labelText != null) {
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = labelText;
      info.appendChild(label);
    }
    return { info, count };
  }

  // MODO TOTAL: uma única linha — ícones das plataformas configuradas
  // lado a lado + a soma geral de TODOS os canais num número só.
  if (settings.mode === "total") {
    const active = PLATFORMS.filter((p) => (channels[p] || []).length);
    const row = document.createElement("div");
    row.className = "row";
    row.style.animationDelay = "0ms";

    const group = document.createElement("div");
    group.className = "badge-group";
    const totalBadges = {};
    active.forEach((p) => {
      const badge = document.createElement("div");
      badge.className = "badge " + p;
      badge.innerHTML = ICONS[p];
      group.appendChild(badge);
      totalBadges[p] = badge;
    });

    const made = makeInfo(null);
    row.appendChild(group);
    row.appendChild(made.info);
    widget.appendChild(row);
    rowEls["__total__"] = {
      count: made.count,
      rowEl: row,
      valueShown: 0,
      badges: totalBadges,
    };
    built = true;
    return;
  }

  // MODOS SUM / EACH: uma linha por plataforma (sum) ou por canal (each)
  const items = []; // { key, platform, label }
  PLATFORMS.forEach((platform) => {
    const list = channels[platform] || [];
    if (!list.length) return;
    if (settings.mode === "each") {
      list.forEach((ch) => {
        const cleanLabel = ch.replace(/^v:/, "").replace(/^@/, "");
        items.push({ key: platform + ":" + ch, platform, label: cleanLabel });
      });
    } else {
      items.push({ key: platform, platform, label: null });
    }
  });

  items.forEach((it, idx) => {
    const row = document.createElement("div");
    row.className = "row";
    row.style.animationDelay = idx * 70 + "ms";

    const badge = document.createElement("div");
    badge.className = "badge " + it.platform;
    badge.innerHTML = ICONS[it.platform];

    const made = makeInfo(it.label);

    row.appendChild(badge);
    row.appendChild(made.info);
    widget.appendChild(row);

    rowEls[it.key] = { count: made.count, rowEl: row, valueShown: 0 };
  });

  built = true;
}

/* animação de contagem */
function tween(el, from, to) {
  const dur = 600;
  const start = performance.now();
  function step(now) {
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = fmt(Math.round(from + (to - from) * eased));
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function updateCell(cell, value, isLive, hasError) {
  if (hasError) {
    cell.count.textContent = "—";
    cell.valueShown = 0;
  } else if (cell.valueShown !== value) {
    tween(cell.count, cell.valueShown, value);
    cell.valueShown = value;
  }
  const dim = !isLive || hasError;
  cell.rowEl.classList.toggle("offline", dim);
  if (settings.hideOffline) cell.rowEl.style.display = dim ? "none" : "";
}

function applyData(data) {
  if (!built) buildRows();

  // MODO TOTAL: soma TODOS os canais de TODAS as plataformas numa linha só
  if (settings.mode === "total") {
    const cell = rowEls["__total__"];
    if (!cell) return;
    let total = 0;
    let anyLive = false;
    let resultCount = 0;
    let errorCount = 0;
    PLATFORMS.forEach((platform) => {
      const results = data[platform] || [];
      let platformLive = false;
      results.forEach((r) => {
        resultCount++;
        if (r.error) errorCount++;
        if (r.live && r.viewers != null) {
          total += r.viewers || 0;
          anyLive = true;
          platformLive = true;
        }
      });
      // com hideoffline=1, esconde o ícone da plataforma que não tem
      // nenhum canal ao vivo no momento
      if (settings.hideOffline && cell.badges && cell.badges[platform]) {
        cell.badges[platform].style.display = platformLive ? "" : "none";
      }
    });
    // só trata como erro se TODOS os canais deram erro
    const allError = resultCount > 0 && errorCount === resultCount;
    updateCell(cell, total, anyLive, allError);
    return;
  }

  // MODOS SUM / EACH
  PLATFORMS.forEach((platform) => {
    const results = data[platform] || [];
    if (!results.length) return;

    if (settings.mode === "each") {
      results.forEach((r) => {
        const cell = rowEls[platform + ":" + r.channel];
        if (!cell) return;
        const live = !!r.live && r.viewers != null;
        updateCell(cell, live ? r.viewers : 0, live, !!r.error);
      });
    } else {
      const cell = rowEls[platform];
      if (!cell) return;
      const liveOnes = results.filter((r) => r.live && r.viewers != null);
      const total = liveOnes.reduce((s, r) => s + (r.viewers || 0), 0);
      // erro só conta se TODOS deram erro (ex.: Kick sem proxy)
      const allError = results.every((r) => r.error);
      updateCell(cell, total, liveOnes.length > 0, allError);
    }
  });
}

/* =================================================================
   LOOP DE ATUALIZAÇÃO
   ================================================================= */
async function poll() {
  try {
    const [tw, yt, kk] = await Promise.all([
      Promise.all((channels.twitch || []).map(getTwitch)),
      Promise.all((channels.youtube || []).map(getYouTube)),
      Promise.all((channels.kick || []).map(getKick)),
    ]);
    applyData({ twitch: tw, youtube: yt, kick: kk });
    widget.classList.remove("stale");
  } catch (e) {
    if (built) widget.classList.add("stale");
    console.error("[contador-viewers]", e);
  }
}

function escapeAttr(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;");
}

  function norm(s) {
    return s.split(",").map((x) => x.trim()).filter(Boolean).join(",");
  }

  function buildUrl() {
    // monta o query string na mão pra sair limpo (sem %2C, %40 etc.) —
    // nomes de canal só usam caracteres válidos em query string
    const parts = [];
    const tw = norm($("wz-twitch").value.trim());
    const yt = norm($("wz-youtube").value.trim());
    const kk = norm($("wz-kick").value.trim());
    if (tw) parts.push("twitch=" + tw);

      parts.push("poll=" + Math.max(5, poll));
    if (!isNaN(bg) && bg !== CONFIG.bgOpacity) parts.push("bg=" + bg);
    if ($("wz-compact").checked) parts.push("compact=1");
    if ($("wz-hideoffline").checked) parts.push("hideoffline=1");

    const base = location.origin + location.pathname;
    return parts.length ? base + "?" + parts.join("&") : base;
  }

  // ----- prévia ao vivo com dados de exemplo -----
  function fakeCount(name) {
    // número fake estável por nome de canal (não muda enquanto digita)
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return 40 + (h % 4800); // 40..4839
  }

  function renderPreview() {
    const stage = $("wz-preview");
    if (!stage) return;
    stage.innerHTML = "";

    const mode = $("wz-mode").value;
    const layout = $("wz-layout").value;
    const pos = $("wz-pos").value;
    const compact = $("wz-compact").checked;
    const bg = parseInt($("wz-bg").value, 10);

    // canais do formulário; se tudo vazio, usa um conjunto de exemplo
    let pc = {
      twitch: norm($("wz-twitch").value).split(",").filter(Boolean),
      youtube: norm($("wz-youtube").value).split(",").filter(Boolean),
      kick: norm($("wz-kick").value).split(",").filter(Boolean),
    };
    if (!PLATFORMS.some((p) => pc[p].length)) {
      pc = { twitch: ["twitch"], youtube: ["youtube"], kick: ["kick"] };
    }
    const active = PLATFORMS.filter((p) => pc[p].length);

    const fmtN = (n) =>
      compact
        ? new Intl.NumberFormat("pt-BR", {
            notation: "compact",
            maximumFractionDigits: 1,
          }).format(n)
        : new Intl.NumberFormat("pt-BR").format(n);

    const card = document.createElement("div");
    card.className = "preview-card layout-" + layout + " ppos-" + pos;
    // aplica o fundo com a opacidade do slider. Monta o rgba() COMPLETO
    // no JS (sem var() aninhado) e seta direto no background — assim não
    // depende de como o navegador resolve variável CSS dentro de variável.
    const bgRgb =
      (getComputedStyle(document.documentElement).getPropertyValue("--bg-rgb") ||
        "14, 15, 20").trim();
    const a = (isNaN(bg) ? 78 : bg) / 100;
    card.style.background = "rgba(" + bgRgb + ", " + a + ")";
    // borda, sombra e desfoque também escalam com a opacidade — em bg=0 o
    // card some por completo, igual ao overlay real
    card.style.borderColor = "rgba(255, 255, 255, " + 0.1 * a + ")";
    card.style.boxShadow = "0 8px 28px rgba(0, 0, 0, " + 0.45 * a + ")";
    card.style.backdropFilter = "blur(" + 14 * a + "px) saturate(140%)";
    card.style.webkitBackdropFilter = card.style.backdropFilter;

    function makeRow(badgesHtml, numberText, labelText) {
      const row = document.createElement("div");
      row.className = "row";
      row.style.cssText = "opacity:1;transform:none;animation:none";
      const wrap = document.createElement("div");
      wrap.innerHTML = badgesHtml;
      while (wrap.firstChild) row.appendChild(wrap.firstChild);
      const info = document.createElement("div");
      info.className = "info";
      const cl = document.createElement("div");
      cl.className = "count-line";
      const dot = document.createElement("span");
      dot.className = "live-dot";
      const cnt = document.createElement("span");
      cnt.className = "count";
      cnt.textContent = numberText;
      cl.appendChild(dot);
      cl.appendChild(cnt);
      info.appendChild(cl);
      if (labelText != null) {
        const lb = document.createElement("span");
        lb.className = "label";
        lb.textContent = labelText;
        info.appendChild(lb);
      }
      row.appendChild(info);
      return row;
    }

    const badgeHtml = (p) => '<div class="badge ' + p + '">' + ICONS[p] + "</div>";

    if (mode === "total") {
      let total = 0;
      active.forEach((p) => pc[p].forEach((c) => (total += fakeCount(c))));
      const group =
        '<div class="badge-group">' + active.map(badgeHtml).join("") + "</div>";
      card.appendChild(makeRow(group, fmtN(total), null));
    } else if (mode === "each") {
      active.forEach((p) => {
        pc[p].forEach((c) => {
          const label = c.replace(/^v:/, "").replace(/^@/, "");
          card.appendChild(makeRow(badgeHtml(p), fmtN(fakeCount(c)), label));
        });
      });
    } else {
      // sum
      active.forEach((p) => {
        let total = 0;
        pc[p].forEach((c) => (total += fakeCount(c)));
        card.appendChild(makeRow(badgeHtml(p), fmtN(total), null));
      });
    }

    stage.appendChild(card);
  }

  function refresh() {
    $("wz-bg-val").textContent = $("wz-bg").value + "%";
    $("wz-out").textContent = buildUrl();
    $("wz-copied").textContent = "";
    renderPreview();
  }

  w.querySelectorAll("input, select").forEach((el) => {
    el.addEventListener("input", refresh);
    el.addEventListener("change", refresh);
  });
  refresh();

  $("wz-copy").addEventListener("click", async () => {
    const url = buildUrl();
    try {
      await navigator.clipboard.writeText(url);
      $("wz-copied").textContent = "Link copiado!";
    } catch (e) {
      // fallback: seleciona o texto do link pro usuário copiar manual
      const out = $("wz-out");
      const range = document.createRange();
      range.selectNodeContents(out);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      try {
        document.execCommand("copy");
        $("wz-copied").textContent = "Link copiado!";
      } catch (e2) {
        $("wz-copied").textContent = "Não consegui copiar — selecione o link acima.";
      }
    }
  });

  $("wz-open").addEventListener("click", () => {
    const url = buildUrl();
    if (!/[?&](twitch|youtube|kick)=/.test(url)) {
      $("wz-copied").textContent = "Adicione pelo menos um canal antes de abrir.";
      return;
    }
    location.href = url;
  });
}

function start() {
  const total = PLATFORMS.reduce(
    (s, p) => s + (channels[p] ? channels[p].length : 0),
    0
  );
  // sem nenhum canal, ou ?setup=1 na URL -> abre o wizard de configuração
  if (total === 0 || params.get("setup") === "1") {
    showWizard();
    return;
  }
  poll();
  setInterval(poll, settings.poll * 1000);
}

start();
</script>
</body>
</html>

<!--
  ============================================================
  PLANO B — PROXY PRÓPRIO DO KICK
  ============================================================
  Por padrão o Kick passa pelo corsproxy.io (mesmo proxy do seu overlay
  de localização), e não precisa de nada disto aqui.

  MAS: o Kick fica atrás do Cloudflare, e o corsproxy.io PODE ser
  bloqueado por ele (resposta 403 / Cloudflare challenge). Se isso
  acontecer — canais de Kick aparecendo sempre esmaecidos enquanto
  Twitch/YouTube funcionam — a solução definitiva é ter um proxy seu.

  O código abaixo é um Cloudflare Worker minúsculo, só pra Kick. Para
  usar: dash.cloudflare.com -> Workers & Pages -> Create Worker -> cole
  isto -> Deploy. Depois troque o campo kickProxy lá no CONFIG pela
  URL do seu Worker (algo .workers.dev, SEM "?url=" no fim — o overlay
  detecta sozinho que é proxy dedicado e usa ?slug=). Se preferir, dá
  pra rodar o mesmo conceito como uma rota no seu Coolify / servidor.

  Ele tenta a API OFICIAL do Kick se você configurar as variáveis
  KICK_CLIENT_ID e KICK_CLIENT_SECRET (kick.com/settings/developer ->
  criar app OAuth). Sem essas variáveis, ele cai no endpoint não-oficial
  (funciona às vezes, pode ser bloqueado pelo Cloudflare do Kick).

  ---- início do Worker ----

  const CORS = {
    "Access-Control-Allow-Origin": "*",
    "Content-Type": "application/json; charset=utf-8",
    "Cache-Control": "no-store",
  };

  export default {
    async fetch(request, env, ctx) {
      const slug = new URL(request.url).searchParams.get("slug");
      if (!slug) return new Response(JSON.stringify({ error: "sem_slug" }), { headers: CORS });

      // 1) tenta API oficial (precisa de KICK_CLIENT_ID + KICK_CLIENT_SECRET)
      if (env.KICK_CLIENT_ID && env.KICK_CLIENT_SECRET) {
        try {
          const cache = caches.default;
          const tkKey = new Request("https://cache.local/kick-token");
          let token = null;
          const cachedTk = await cache.match(tkKey);
          if (cachedTk) token = await cachedTk.text();
          if (!token) {
            const tr = await fetch("https://id.kick.com/oauth/token", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({
                grant_type: "client_credentials",
                client_id: env.KICK_CLIENT_ID,
                client_secret: env.KICK_CLIENT_SECRET,
              }),
            });
            if (tr.ok) {
              const tj = await tr.json();
              token = tj.access_token;
              if (token) ctx.waitUntil(cache.put(tkKey,
                new Response(token, { headers: { "Cache-Control": "max-age=3000" } })));
            }
          }
          if (token) {
            const r = await fetch(
              "https://api.kick.com/public/v1/channels?slug=" + encodeURIComponent(slug),
              { headers: { Authorization: "Bearer " + token, Accept: "application/json" } }
            );
            if (r.ok) {
              const j = await r.json();
              const ch = j.data && j.data[0];
              const live = ch && ch.stream && ch.stream.is_live;
              return new Response(JSON.stringify({
                live: !!live,
                viewers: live ? (ch.stream.viewer_count || 0) : 0,
              }), { headers: CORS });
            }
          }
        } catch (e) { /* cai pro fallback abaixo */ }
      }

      // 2) fallback: endpoint não-oficial do Kick
      try {
        const r = await fetch("https://kick.com/api/v2/channels/" + encodeURIComponent(slug), {
          headers: { Accept: "application/json", "User-Agent": "Mozilla/5.0" },
        });
        if (!r.ok) return new Response(JSON.stringify({ live: false, viewers: 0, error: "http_" + r.status }), { headers: CORS });
        const j = await r.json();
        const ls = j.livestream;
        return new Response(JSON.stringify({
          live: !!(ls && ls.is_live),
          viewers: ls && ls.is_live ? (ls.viewer_count || 0) : 0,
        }), { headers: CORS });
      } catch (e) {
        return new Response(JSON.stringify({ live: false, viewers: 0, error: "falhou" }), { headers: CORS });
      }
    },
  };

  ---- fim do Worker ----
  ============================================================
